<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>造句小助教 — Steph's English Lab</title>
<style>
  :root {
    --green: #4a7c59;
    --green-light: #e6efe8;
    --bg: #faf8f5;
    --ink: #2f3a32;
    --muted: #8a9a8d;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center;
    padding:20px 16px 40px; line-height:1.6;
  }
  .app { width:100%; max-width:480px; }
  .card {
    background:#fff; border-radius:20px; padding:26px 22px;
    box-shadow:0 4px 24px rgba(74,124,89,.10);
  }
  .brand { text-align:center; color:var(--muted); font-size:12px; letter-spacing:2px; margin-bottom:14px; }
  h1 { font-size:23px; color:var(--green); text-align:center; margin-bottom:6px; }
  .sub { text-align:center; color:var(--muted); font-size:13.5px; margin-bottom:20px; }

  label { display:block; font-size:14px; color:var(--green); font-weight:700; margin-bottom:7px; }
  textarea {
    width:100%; min-height:110px; padding:13px 14px; font-size:16px;
    border:2px solid var(--green-light); border-radius:13px;
    background:var(--bg); font-family:inherit; color:var(--ink);
    resize:vertical; line-height:1.6;
  }
  textarea:focus { outline:none; border-color:var(--green); }
  .hint { font-size:12px; color:var(--muted); margin-top:7px; }

  .pick { margin-top:22px; }
  .pick-title { font-size:14px; font-weight:700; color:var(--green); margin-bottom:11px; }
  .ai {
    display:flex; align-items:center; gap:13px; width:100%;
    padding:14px 16px; margin-bottom:9px;
    background:var(--bg); border:2px solid var(--green-light);
    border-radius:14px; cursor:pointer; font-family:inherit;
    font-size:15px; color:var(--ink); text-align:left;
    transition:all .15s;
  }
  .ai:active { transform:scale(.99); }
  .ai .ico {
    flex-shrink:0; width:34px; height:34px; border-radius:10px;
    display:grid; place-items:center; font-size:17px; font-weight:800;
    background:var(--green); color:#fff;
  }
  .ai .txt { flex:1; }
  .ai .txt b { display:block; font-size:15px; }
  .ai .txt span { font-size:12px; color:var(--muted); }
  .ai .go { flex-shrink:0; color:var(--green); font-weight:700; font-size:19px; }

  .copybar {
    margin-top:16px; padding-top:16px;
    border-top:1px dashed rgba(74,124,89,.28);
  }
  .copybtn {
    width:100%; padding:13px; font-size:14.5px; font-weight:700;
    background:transparent; color:var(--green);
    border:2px solid var(--green-light); border-radius:13px;
    cursor:pointer; font-family:inherit;
  }
  .copybtn:active { transform:scale(.99); }

  .toast {
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:var(--green); color:#fff; padding:12px 22px; border-radius:99px;
    font-size:14px; font-weight:600; opacity:0; pointer-events:none;
    transition:all .25s; z-index:9; box-shadow:0 6px 20px rgba(74,124,89,.3);
  }
  .toast.on { opacity:1; transform:translateX(-50%) translateY(0); }

  .tips {
    margin-top:18px; background:#fff8ec; border-radius:13px;
    padding:14px 16px; font-size:13px; color:#7a6444; line-height:1.75;
  }
  .tips b { color:#a07a3c; }
  .foot { text-align:center; font-size:11.5px; color:var(--muted); margin-top:20px; letter-spacing:1px; }
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="brand">STEPH'S ENGLISH LAB</div>
    <h1>✏️ 造句小助教</h1>
    <p class="sub">寫下你的英文句子，選一個 AI 幫你批改</p>

    <label for="sent">你的英文句子</label>
    <textarea id="sent" placeholder="例：I get butterflies in my stomach whenever I see my crush."></textarea>
    <p class="hint">💡 用今天學的 idiom 造句，寫錯也沒關係，改過就學會了</p>

    <div class="pick">
      <div class="pick-title">選一個 AI 幫你批改 👇</div>

      <button class="ai" id="btn-gpt">
        <span class="ico">G</span>
        <span class="txt"><b>ChatGPT</b><span>自動帶入，直接按送出</span></span>
        <span class="go">→</span>
      </button>

      <button class="ai" id="btn-claude">
        <span class="ico">C</span>
        <span class="txt"><b>Claude</b><span>自動帶入，直接按送出</span></span>
        <span class="go">→</span>
      </button>

      <button class="ai" id="btn-gemini">
        <span class="ico">✦</span>
        <span class="txt"><b>Gemini</b><span>先複製，貼上就好</span></span>
        <span class="go">→</span>
      </button>

      <div class="copybar">
        <button class="copybtn" id="btn-copy">📋 只複製批改指令（貼到任何 AI）</button>
      </div>
    </div>

    <div class="tips">
      <b>批改會告訴你：</b><br>
      ✅ idiom 用得對不對　📝 文法和用字<br>
      ✨ Native speaker 會怎麼說　💡 一個小提醒
    </div>

    <div class="foot">ENGLISH FOR CONNECTION 🌿</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var PROMPT = [
    "你是 Steph's English Lab 的 AI 英文助教，Stephanie 老師的學生會用英文 idiom 造句，請幫他批改。",
    "",
    "請用繁體中文（台灣用語）回覆，語氣像溫暖的英文老師：先肯定他願意寫，再指出可以更好的地方。不要說教，每段控制在 1-3 句。",
    "",
    "嚴格照這個格式回覆，只有六段：",
    "",
    "📝 你的句子：[原封不動複述]",
    "✅ 片語用法正確！（或 ⚠️ 片語用法需要調整）",
    "📖 片語解析：[這個 idiom 的意思和典型用法；若他沒用到 idiom，推薦一個適合這個情境的]",
    "📝 文法批改：[有錯具體指出在哪、為什麼；完全沒錯就寫「文法正確！」]",
    "✨ Native 說法：[1-2 個更自然的版本，保留他的原意]",
    "💡 小提醒：[一個鼓勵或補充小知識]",
    "",
    "注意：✅ 和 ⚠️ 的判定必須跟後面的分析一致。idiom 用對但文法有錯，仍標 ✅，在文法批改說明即可。",
    "",
    "我的句子是："
  ].join("\n");

  var $ = function (id) { return document.getElementById(id); };
  var toastTimer;

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2200);
  }

  function getSentence() {
    var v = $('sent').value.trim();
    if (!v) {
      $('sent').focus();
      toast('先寫一個英文句子吧 ☺️');
      return null;
    }
    return v;
  }

  function fullPrompt(sentence) {
    return PROMPT + "\n" + sentence;
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        resolve();
      } catch (e) { reject(e); }
    });
  }

  // ChatGPT 與 Claude 支援用網址參數帶入問題
  $('btn-gpt').addEventListener('click', function () {
    var s = getSentence();
    if (!s) return;
    window.open('https://chatgpt.com/?q=' + encodeURIComponent(fullPrompt(s)), '_blank');
  });

  $('btn-claude').addEventListener('click', function () {
    var s = getSentence();
    if (!s) return;
    window.open('https://claude.ai/new?q=' + encodeURIComponent(fullPrompt(s)), '_blank');
  });

  // Gemini 不支援帶入，改成複製後開啟
  $('btn-gemini').addEventListener('click', function () {
    var s = getSentence();
    if (!s) return;
    copyText(fullPrompt(s)).then(function () {
      toast('已複製！貼上就可以了');
      setTimeout(function () { window.open('https://gemini.google.com/app', '_blank'); }, 700);
    }).catch(function () {
      toast('複製失敗，請手動選取複製 🙏');
    });
  });

  $('btn-copy').addEventListener('click', function () {
    var s = getSentence();
    if (!s) return;
    copyText(fullPrompt(s)).then(function () {
      toast('已複製，貼到任何 AI 都可以 ✅');
    }).catch(function () {
      toast('複製失敗，請手動選取複製 🙏');
    });
  });
})();
</script>
</body>
</html>
